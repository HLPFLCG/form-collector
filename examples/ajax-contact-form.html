<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJAX Contact Form Example</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }

    h1 {
      margin-bottom: 10px;
      color: #1f2937;
      font-size: 28px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #374151;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover:not(:disabled) {
      background: #2563eb;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .required {
      color: #ef4444;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert-success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
  <div class="container">
    <h1>Get in Touch</h1>
    <p class="subtitle">We'd love to hear from you. Send us a message!</p>

    <div id="alert" class="alert"></div>

    <form id="contactForm">
      <div class="form-group">
        <label for="name">
          Name <span class="required">*</span>
        </label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          placeholder="John Doe"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">
          Email <span class="required">*</span>
        </label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="john@example.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="phone">
          Phone
        </label>
        <input 
          type="tel" 
          id="phone" 
          name="phone" 
          placeholder="+1 (555) 123-4567"
        >
      </div>

      <div class="form-group">
        <label for="subject">
          Subject <span class="required">*</span>
        </label>
        <input 
          type="text" 
          id="subject" 
          name="subject" 
          placeholder="How can we help?"
          required
        >
      </div>

      <div class="form-group">
        <label for="message">
          Message <span class="required">*</span>
        </label>
        <textarea 
          id="message" 
          name="message" 
          placeholder="Tell us more about your inquiry..."
          required
        ></textarea>
      </div>

      <button type="submit" id="submitBtn">
        <span id="btnText">Send Message</span>
      </button>
    </form>
  </div>

  <script>
    // IMPORTANT: Replace with your actual API key and URL
    const FORM_COLLECTOR_URL = 'http://localhost:3000/api/submit/YOUR_API_KEY';

    const form = document.getElementById('contactForm');
    const alert = document.getElementById('alert');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    function showAlert(message, type) {
      alert.textContent = message;
      alert.className = `alert alert-${type} show`;
      
      // Auto-hide after 5 seconds
      setTimeout(() => {
        alert.classList.remove('show');
      }, 5000);
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      if (loading) {
        btnText.innerHTML = '<span class="spinner"></span>Sending...';
      } else {
        btnText.textContent = 'Send Message';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Get form data
      const formData = new FormData(form);
      const data = Object.fromEntries(formData);
      
      // Show loading state
      setLoading(true);
      alert.classList.remove('show');
      
      try {
        const response = await fetch(FORM_COLLECTOR_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (response.ok) {
          // Success
          showAlert(result.message || 'Message sent successfully!', 'success');
          form.reset();
        } else {
          // Error from server
          showAlert(result.error || 'Failed to send message. Please try again.', 'error');
        }
      } catch (error) {
        // Network error
        console.error('Submission error:', error);
        showAlert('Network error. Please check your connection and try again.', 'error');
      } finally {
        setLoading(false);
      }
    });

    // Optional: Add real-time validation
    const emailInput = document.getElementById('email');
    emailInput.addEventListener('blur', () => {
      const email = emailInput.value;
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      
      if (email && !emailRegex.test(email)) {
        emailInput.style.borderColor = '#ef4444';
      } else {
        emailInput.style.borderColor = '#e5e7eb';
      }
    });
  </script>
</body>
</html>
