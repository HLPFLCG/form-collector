<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter Signup Example</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .newsletter-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    h2 {
      color: #1f2937;
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      color: #6b7280;
      margin-bottom: 30px;
      font-size: 16px;
      line-height: 1.6;
    }

    .form-row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="email"] {
      flex: 1;
      padding: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input[type="email"]:focus {
      outline: none;
      border-color: #3b82f6;
    }

    button {
      padding: 14px 28px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      background: #2563eb;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      text-align: left;
      margin-bottom: 20px;
    }

    input[type="checkbox"] {
      margin-right: 10px;
      margin-top: 4px;
    }

    .checkbox-group label {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.5;
    }

    .checkbox-group a {
      color: #3b82f6;
      text-decoration: none;
    }

    .checkbox-group a:hover {
      text-decoration: underline;
    }

    .privacy-note {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 20px;
    }

    .alert {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert-success {
      background: #d1fae5;
      color: #065f46;
    }

    .alert-error {
      background: #fee2e2;
      color: #991b1b;
    }

    @media (max-width: 480px) {
      .form-row {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
  <div class="newsletter-box">
    <div class="icon">📧</div>
    <h2>Stay Updated</h2>
    <p>Subscribe to our newsletter and get the latest updates delivered to your inbox.</p>

    <div id="alert" class="alert"></div>

    <form id="newsletterForm">
      <div class="form-row">
        <input 
          type="email" 
          name="email" 
          placeholder="Enter your email address"
          required
        >
        <button type="submit" id="submitBtn">Subscribe</button>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="consent" name="consent" value="yes" required>
        <label for="consent">
          I agree to receive marketing emails and accept the 
          <a href="#" target="_blank">Privacy Policy</a>
        </label>
      </div>
    </form>

    <p class="privacy-note">
      🔒 We respect your privacy. Unsubscribe at any time.
    </p>
  </div>

  <script>
    // IMPORTANT: Replace with your actual API key and URL
    const FORM_COLLECTOR_URL = 'http://localhost:3000/api/submit/YOUR_API_KEY';

    const form = document.getElementById('newsletterForm');
    const alert = document.getElementById('alert');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, type) {
      alert.textContent = message;
      alert.className = `alert alert-${type} show`;
      
      setTimeout(() => {
        alert.classList.remove('show');
      }, 5000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = new FormData(form);
      const data = Object.fromEntries(formData);
      
      // Add subscription timestamp
      data.subscribed_at = new Date().toISOString();
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Subscribing...';
      
      try {
        const response = await fetch(FORM_COLLECTOR_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (response.ok) {
          showAlert('🎉 Successfully subscribed! Check your email.', 'success');
          form.reset();
        } else {
          showAlert(result.error || 'Subscription failed. Please try again.', 'error');
        }
      } catch (error) {
        showAlert('Network error. Please try again.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Subscribe';
      }
    });
  </script>
</body>
</html>
